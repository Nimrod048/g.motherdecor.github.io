<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MotherDecor — Decorações para aluguel</title>
<link rel="icon" href="images/logo.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topo"></header>
<section class="hero"><div class="wrap">
<h1>Alugue a decoração, fique só com a festa.</h1>
<p>Painéis, arcos, flores e iluminação por diária, para casamentos, aniversários, chás de bebê e eventos corporativos.</p>
<form class="busca" action="catalogo.html"><input name="q" type="search" placeholder="Buscar: arco, floral, safari…" aria-label="Buscar decorações"><button class="btn">Buscar</button></form>
</div></section>
<main class="wrap"><h2>Explore por categoria</h2><div class="cats" id="cats"></div></main>
<footer id="rodape"></footer>
<script src="app.js"></script>
<script>
(async()=>{
await layout("inicio");
try{const d=await api("itens");CATS=d.categorias;
$("#cats").innerHTML=CATS.map(c=>{const n=d.itens.filter(i=>i.categoria===c.nome).length;return `<a class="cat" href="catalogo.html?categoria=${encodeURIComponent(c.nome)}"><span class="em">${c.e}</span><strong>${esc(c.nome)}</strong><small>${n} ${n===1?"item":"itens"}</small></a>`}).join("")}
catch(e){$("#cats").innerHTML=`<p class="vazio">${esc(e.message)}</p>`}
})();
</script>
</body>
</html>
